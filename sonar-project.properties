sonar.projectKey=lsx-xyg_blog
sonar.organization=lsx-xyg


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=blog
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude build artifacts and static assets from analysis
sonar.exclusions=.next/**,public/**,**/*.d.ts


# 覆盖率（vitest v8 + lcov）
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 版本化基线：新代码周期 = 上一版本差异（免费版不能自定义 gate，
# 用版本号把历史改动固定为基线，之后每次开发只需覆盖当次改动行）
sonar.projectVersion=1.0.0
sonar.new_code_period=previous_version
