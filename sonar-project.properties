# SonarCloud 项目配置（SonarSource 官方 sonarcloud-github-action 使用）
#
# 首次接入步骤：
# 1. 到 https://sonarcloud.io 用 GitHub 账号登录，Import 本仓库创建项目
#    （或选 "Analyze new project" → GitHub → 找到 lsx-xyg/blog）
# 2. 把下方 projectKey / organization 改成你在 SonarCloud 里的实际值
# 3. SonarCloud 项目主页 → Administration → Analysis Method → 生成 token
# 4. GitHub 仓库 Settings → Secrets and variables → Actions → 新增 SONAR_TOKEN
#
# 目录范围：
# - sonar.sources：扫描的源码目录
# - sonar.exclusions：跳过构建产物/测试文件（测试由 TS 分析自动包含，无需单独列）

sonar.projectKey=lsx-xyg_blog
sonar.organization=lsx-xyg
sonar.projectName=blog

# 源码范围（Next.js 应用代码 + 测试）
sonar.sources=app,components,lib,db,scripts

# 排除：构建产物、静态资源、类型声明
sonar.exclusions=.next/**,public/**,**/*.d.ts

# TypeScript 分析：指向 tsconfig 以获得正确的解析范围
sonar.typescript.tsconfigPaths=tsconfig.json

# ---- 覆盖率（可选，默认关闭）----
# 启用步骤：npm i -D @vitest/coverage-v8，
# package.json test 脚本改为 "vitest run --coverage"，
# 然后取消下面一行的注释：
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
